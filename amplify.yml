version: 1
applications:
  - frontend:
      phases:
        preBuild:
          commands:
            - cd frontend
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: frontend/dist
        files:
          - '**/*'
      cache:
        paths:
          - frontend/node_modules/**/*
    appRoot: .
  - backend:
      phases:
        preBuild:
          commands:
            - cd lambda
            - npm ci
        build:
          commands:
            - npm run build
            - cd dist && zip -r ../lambda.zip .
      artifacts:
        baseDirectory: lambda
        files:
          - lambda.zip
          - package.json
          - package-lock.json
      cache:
        paths:
          - lambda/node_modules/**/*
    appRoot: .
